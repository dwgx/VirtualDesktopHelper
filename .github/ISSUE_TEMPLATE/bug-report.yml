- 头显型号与系统版本：
- 你的 PC 是有线还是 Wi-Fi 连的：
- 头显是 Wi-Fi 还是有线连路由器的：
- 之前能不能连上、什么时候开始不行：
- 换过什么（路由器 / 网线 / 固件 / 驱动）：

## 隐私

报告不写任何 DPAPI 密文、令牌、账户条目内容。**但会保留机器名、用户名与局域网地址** ——
没有它们别人没法判断你的网络环境。贴到公开场合前请自己再看一眼。